# Local development: `docker compose up` → web http://localhost:5173, API docs http://localhost:8000/api/docs
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: autonodwell }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, retries: 20 }

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/autonodwell
      AUTH_MODE: dev
      ADMIN_EMAILS: admin@example.com
      CRM_PROVIDER: ${CRM_PROVIDER:-none}
      GHL_PRIVATE_TOKEN: ${GHL_PRIVATE_TOKEN:-}
      GHL_LOCATION_ID: ${GHL_LOCATION_ID:-}
      PORT: "8000"
    command: sh -c "alembic upgrade head && python -m app.seed --demo && python -m app.load_land && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./api:/srv"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  web:
    image: node:22
    working_dir: /web
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    environment: { VITE_API_PROXY: "http://api:8000" }
    volumes: ["./web:/web", "/web/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
