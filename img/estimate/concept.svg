      <text x="282" y="240" font-size="9" letter-spacing="1.5">CONSTRUCTION SET</text>
      <text x="282" y="252" font-size="8" opacity=".7">SHEET A-101 · STAMPED</text>
    </g>
  </g>
  <!-- What it is: concept rendering -->
  <g>
    <rect x="36" y="64" width="236" height="196" rx="14" fill="#fff" stroke="#351E28" stroke-width="2"/>
    <clipPath id="c1"><rect x="44" y="72" width="220" height="150" rx="9"/></clipPath>
    <g clip-path="url(#c1)">
      <rect x="44" y="72" width="220" height="150" fill="#FFE9DF"/>
      <circle cx="222" cy="104" r="18" fill="#E9F056"/>
      <rect x="44" y="186" width="220" height="36" fill="#AEB8A0"/>
      <path d="M86 186 V138 L142 104 L198 138 V186 Z" fill="#fff" stroke="#351E28" stroke-width="2" stroke-linejoin="round"/>
