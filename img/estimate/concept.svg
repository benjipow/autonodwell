    <text x="56" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#351E28" letter-spacing="1.2">CONCEPT</text>
    <text x="252" y="245" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#351E28" opacity=".7">See the idea</text>
  </g>
  <!-- not-equal badge -->
  </g>
  <circle cx="248" cy="70" r="22" fill="#E9F056" stroke="#351E28" stroke-width="2"/>
  <g stroke="#351E28" stroke-width="3" stroke-linecap="round"><line x1="238" y1="65" x2="258" y2="65"/><line x1="238" y1="75" x2="258" y2="75"/><line x1="254" y1="58" x2="242" y2="82"/></g>
