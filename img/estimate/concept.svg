<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="A concept rendering of a home in front of a faded construction plan set">
  <rect width="480" height="300" rx="18" fill="#D7EFFF"/>
  <g transform="translate(-14 0)">
  <!-- What it isn't: construction plan set, ghosted -->
  <g transform="rotate(4 340 150)" opacity=".55">
    <rect x="244" y="38" width="208" height="226" rx="6" fill="#fff" stroke="#351E28" stroke-width="1.5" stroke-dasharray="6 5"/>
    <g stroke="#351E28" stroke-width="1.2" fill="none">
      <rect x="282" y="72" width="138" height="112"/>
      <line x1="350" y1="72" x2="350" y2="140"/><line x1="282" y1="140" x2="388" y2="140"/>
      <line x1="388" y1="140" x2="388" y2="184"/>
      <path d="M350 104 a22 22 0 0 1 22 22" stroke-dasharray="3 3"/>
      <line x1="282" y1="198" x2="420" y2="198"/><line x1="282" y1="193" x2="282" y2="203"/><line x1="420" y1="193" x2="420" y2="203"/>
      <line x1="434" y1="72" x2="434" y2="184"/><line x1="429" y1="72" x2="439" y2="72"/><line x1="429" y1="184" x2="439" y2="184"/>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" fill="#351E28">
