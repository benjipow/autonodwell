<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="A preliminary monthly payment estimate in front of a faded mortgage preapproval letter">
  <rect width="480" height="300" rx="18" fill="#D7EFFF"/>
  <g transform="translate(-14 0)">
  <!-- What it isn't: preapproval letter, ghosted -->
  <g transform="rotate(4 340 150)" opacity=".55">
    <rect x="244" y="38" width="208" height="226" rx="6" fill="#fff" stroke="#351E28" stroke-width="1.5" stroke-dasharray="6 5"/>
    <g font-family="Helvetica, Arial, sans-serif" fill="#351E28">
      <text x="280" y="72" font-size="11" font-weight="700" letter-spacing="1">PREAPPROVAL</text>
      <text x="280" y="86" font-size="9" opacity=".7">Issued by a lender</text>
    </g>
    <g stroke="#351E28" stroke-width="1.4" stroke-linecap="round" opacity=".7">
      <line x1="280" y1="108" x2="420" y2="108"/><line x1="280" y1="124" x2="404" y2="124"/><line x1="280" y1="140" x2="414" y2="140"/>
      <line x1="280" y1="156" x2="380" y2="156"/><line x1="280" y1="172" x2="410" y2="172"/>
      <line x1="280" y1="232" x2="340" y2="232"/>
    </g>
    <circle cx="398" cy="222" r="24" fill="none" stroke="#351E28" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle cx="398" cy="222" r="15" fill="none" stroke="#351E28" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>
  <!-- What it is: preliminary estimate -->
  <g>
    <rect x="36" y="64" width="236" height="196" rx="14" fill="#fff" stroke="#351E28" stroke-width="2"/>
    <g font-family="Helvetica, Arial, sans-serif" fill="#351E28">
      <text x="56" y="98" font-size="12" font-weight="700" letter-spacing="1.2">ESTIMATED MONTHLY</text>
      <text x="56" y="140" font-size="36" font-weight="700" letter-spacing="-1">$2,400</text>
      <text x="166" y="140" font-size="15" opacity=".7">/mo</text>
    </g>
    <rect x="56" y="162" width="196" height="12" rx="6" fill="#AEB8A0"/>
    <rect x="114" y="162" width="78" height="12" rx="6" fill="#E9F056"/>
    <circle cx="150" cy="168" r="10" fill="#FF5C34" stroke="#351E28" stroke-width="2"/>
    <g font-family="Helvetica, Arial, sans-serif" fill="#351E28" font-size="10" opacity=".7">
      <text x="56" y="192">Lower</text><text x="252" y="192" text-anchor="end">Higher</text>
    </g>
    <text x="56" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#351E28" letter-spacing="1.2">PRELIMINARY</text>
    <text x="252" y="245" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#351E28" opacity=".7">Plan with it</text>
  </g>
  </g>
  <circle cx="248" cy="70" r="22" fill="#E9F056" stroke="#351E28" stroke-width="2"/>
  <g stroke="#351E28" stroke-width="3" stroke-linecap="round"><line x1="238" y1="65" x2="258" y2="65"/><line x1="238" y1="75" x2="258" y2="75"/><line x1="254" y1="58" x2="242" y2="82"/></g>
</svg>
