<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="An early price estimate range in front of a faded, unsigned construction contract">
  <rect width="480" height="300" rx="18" fill="#D7EFFF"/>
  <g transform="translate(-14 0)">
  <!-- What it isn't: binding contract, ghosted -->
  <g transform="rotate(4 340 150)" opacity=".55">
    <rect x="244" y="38" width="208" height="226" rx="6" fill="#fff" stroke="#351E28" stroke-width="1.5" stroke-dasharray="6 5"/>
    <g font-family="Helvetica, Arial, sans-serif" fill="#351E28">
      <text x="280" y="72" font-size="11" font-weight="700" letter-spacing="1">CONSTRUCTION</text>
      <text x="280" y="86" font-size="11" font-weight="700" letter-spacing="1">CONTRACT</text>
    </g>
    <g stroke="#351E28" stroke-width="1.4" stroke-linecap="round" opacity=".7">
      <line x1="280" y1="108" x2="420" y2="108"/><line x1="280" y1="124" x2="410" y2="124"/><line x1="280" y1="140" x2="418" y2="140"/>
      <line x1="280" y1="156" x2="396" y2="156"/><line x1="280" y1="172" x2="412" y2="172"/>
    </g>
    <text x="282" y="234" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#351E28">✕</text>
    <line x1="298" y1="230" x2="430" y2="230" stroke="#351E28" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="298" y="246" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#351E28" opacity=".7">SIGNATURE</text>
  </g>
  <!-- What it is: early price estimate -->
  <g>
    <rect x="36" y="64" width="236" height="196" rx="14" fill="#fff" stroke="#351E28" stroke-width="2"/>
    <g transform="translate(56 88)">
      <path d="M0 18 L18 0 H170 a10 10 0 0 1 10 10 V66 a10 10 0 0 1 -10 10 H18 L0 58 Z" fill="#FF5C34" stroke="#351E28" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="20" cy="38" r="6" fill="#fff" stroke="#351E28" stroke-width="2"/>
      <text x="40" y="49" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#121212" letter-spacing="-1">≈ $412K</text>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" fill="#351E28">
      <text x="56" y="196" font-size="11" opacity=".7">Range</text>
      <text x="252" y="196" font-size="11" text-anchor="end" font-weight="700">$385K – $440K</text>
    </g>
    <rect x="56" y="206" width="196" height="8" rx="4" fill="#E9F056"/>
    <text x="56" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#351E28" letter-spacing="1.2">EARLY ESTIMATE</text>
    <text x="252" y="245" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#351E28" opacity=".7">Compare</text>
  </g>
  </g>
  <circle cx="248" cy="70" r="22" fill="#E9F056" stroke="#351E28" stroke-width="2"/>
  <g stroke="#351E28" stroke-width="3" stroke-linecap="round"><line x1="238" y1="65" x2="258" y2="65"/><line x1="238" y1="75" x2="258" y2="75"/><line x1="254" y1="58" x2="242" y2="82"/></g>
</svg>
